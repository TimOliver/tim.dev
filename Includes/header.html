<header>
    <div id="header-content">
        <div id="logo">
            <a href="/">
                <img src="/img/site/logo.svg" alt="[tim.dev]">
            </a>
        </div>

        <nav aria-label="Primary">
            <div class="menu-closed-bar">
                <a href="/about/">About</a>
                <a href="/archive/">Archive</a>
            </div>
            <ul id="menu">
                <li><a href="/about/">About</a></li>
                <li><a href="/apps/">Apps</a></li>
                <li><a href="/code/">Code</a></li>
                <li><a href="/art/">Art</a></li>
                <li><a href="/talks/">Talks</a></li>
                <li><a href="/archive/">Archive</a></li>
                <li><a href="/contact/">Contact</a></li>
                <li class="menu-row-icons">
                    <div class="theme-toggle">
                        <button type="button" class="theme-toggle-button" aria-label="Theme" aria-haspopup="true" aria-expanded="false">
                            <img src="/img/site/appearance/moon.svg" class="theme-toggle-icon theme-icon-dark" alt="" aria-hidden="true">
                            <img src="/img/site/appearance/sun-bold.svg" class="theme-toggle-icon theme-icon-light" alt="" aria-hidden="true">
                        </button>
                        <div class="theme-popover" role="group" aria-label="Theme choices">
                            <button type="button" data-theme-value="auto" class="theme-option">
                                <img src="/img/site/appearance/auto.svg" alt="">
                                <span>Auto</span>
                            </button>
                            <button type="button" data-theme-value="light" class="theme-option">
                                <img src="/img/site/appearance/sun.svg" alt="">
                                <span>Light</span>
                            </button>
                            <button type="button" data-theme-value="dark" class="theme-option">
                                <img src="/img/site/appearance/moon.svg" alt="">
                                <span>Dark</span>
                            </button>
                        </div>
                    </div>
                    <div class="rss-toggle">
                        <!-- The trigger stays a real link: without JS (or hover) it still
                             reaches the main feed; site.js upgrades it to open the menu. -->
                        <a href="/feed.xml" class="rss-toggle-link" aria-label="RSS feeds" aria-haspopup="true" aria-expanded="false"><img src="/img/site/rss.svg" alt=""></a>
                        <div class="theme-popover rss-popover" role="group" aria-label="RSS feeds">
                            <div class="rss-popover-label">Subscribe via RSS</div>
                            <a class="rss-featured" href="/feed.xml">
                                <img class="rss-featured-icon" src="/img/site/rss-logo.svg" alt="" aria-hidden="true">
                                <span class="rss-featured-text">
                                    <span class="rss-featured-title">tim.dev</span>
                                    <span class="rss-featured-sub">All the latest posts</span>
                                </span>
                            </a>
                            <div class="rss-popover-divider" role="separator"></div>
                            <div class="rss-popover-label">By category</div>
                            <a class="theme-option" href="/feed-dev.xml">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/img/site/ui-icons.svg#development"/></svg>
                                <span>Development</span>
                            </a>
                            <a class="theme-option" href="/feed-icomics.xml">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/img/site/ui-icons.svg#icomics"/></svg>
                                <span>iComics</span>
                            </a>
                            <a class="theme-option" href="/feed-oss.xml">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/img/site/ui-icons.svg#oss"/></svg>
                                <span>Open Source</span>
                            </a>
                            <a class="theme-option" href="/feed-personal.xml">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/img/site/ui-icons.svg#personal"/></svg>
                                <span>Personal</span>
                            </a>
                        </div>
                    </div>
                </li>
                <li class="menu-hamburger">
                    <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
                    <label class="hamburger-button" for="menu-toggle" aria-label="Toggle menu" aria-controls="menu" aria-expanded="false">
                        <svg class="icon-hamburger" width="28" height="22" viewBox="0 0 28 22" fill="none" aria-hidden="true">
                            <line x1="4" y1="4.5" x2="24" y2="4.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <line x1="4" y1="11" x2="24" y2="11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <line x1="4" y1="17.5" x2="24" y2="17.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                        <svg class="icon-close" width="28" height="22" viewBox="0 0 28 22" fill="none" aria-hidden="true">
                            <line x1="6" y1="3" x2="22" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <line x1="22" y1="3" x2="6" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </label>
                </li>
            </ul>
        </nav>
    </div>
</header>
