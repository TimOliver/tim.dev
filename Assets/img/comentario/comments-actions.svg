  <!--
    Profile-bar action mask sprite (Tabler lock | lock-open | settings | logout,
    in four 24-wide cells). Used as a CSS mask-image on Comentario's profile-bar
    tool buttons; the host element's background-color supplies the visible colour.
    Shapes are #fff so the mask works under both alpha- and luminance-masking.
    Select a cell via mask-position (with mask-size: auto 100%):
      0%       -> lock      (cell 0)
      33.333%  -> lock-open (cell 1)
      66.667%  -> settings  (cell 2)
      100%     -> logout    (cell 3)
  -->
