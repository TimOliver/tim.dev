<svg xmlns="http://www.w3.org/2000/svg" width="96" height="24" viewBox="0 0 96 24" fill="#fff">
  <!--
    Login-dialog identity-provider sprite (Apple | Google | Facebook | GitHub,
    in four 24-wide cells). Used as a CSS mask-image on the OAuth buttons in
    Comentario's login dialog; the host element's background-color supplies the
    visible colour, so it follows the theme and the hover lift.

    Shapes are #fff so the mask works under both alpha- and luminance-masking.
    Each brand keeps its own source viewBox on a nested <svg>, which normalises
    the four different coordinate systems (814x1000, 512x512, 671x668,
    512x499.368) into 24x24 cells without touching the path data — the marks
    stay exactly as drawn, just scaled and centred by preserveAspectRatio.

    overflow="visible" on each cell is LOAD-BEARING, not tidy-up-able. A nested
    <svg> clips to its own viewport, and Google's G is drawn flush to its
    viewBox's top and bottom edges (bbox y: 0 -> 512.0 exactly). Clipping a
    shape that sits precisely ON the boundary re-antialiases its edge row
    against the clip, roughly halving that row's coverage — the G rendered with
    a visibly flattened bottom at 20px. None of the four marks overflows its box
    (worst case is Apple, by 0.1 user units ≈ 0.003px on screen), so removing
    the clip cannot bleed one cell into its neighbour.

    Select a cell via mask-position (with mask-size: auto 100%):
      0%       -> apple     (cell 0)
      33.333%  -> google    (cell 1)
      66.667%  -> facebook  (cell 2)
      100%     -> github    (cell 3)
    Cell order is the buttons' display order (see comentario.css), so the
    percentages read in the same sequence as the row.
  -->

  <!-- Apple -->
  <svg x="0" y="0" overflow="visible" width="24" height="24" viewBox="0 0 814 1000" preserveAspectRatio="xMidYMid meet">
    <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
  </svg>

  <!-- Google. Inset to 21 (centred in its 24 cell): the G is a heavy letterform
       and at a full 24 it out-weighs the others optically. At 21 its cap-height
       lines up with the disc marks' diameter. Masks are binary, so shedding
       weight means scaling the mark down — the strokes can't be thinned. -->
  <svg x="25.5" y="1.5" overflow="visible" width="21" height="21" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M32.582 370.734C15.127 336.291 5.12 297.425 5.12 256c0-41.426 10.007-80.291 27.462-114.735C74.705 57.484 161.047 0 261.12 0c69.12 0 126.836 25.367 171.287 66.793l-73.31 73.309c-26.763-25.135-60.276-38.168-97.977-38.168-66.56 0-123.113 44.917-143.36 105.426-5.12 15.36-8.146 31.65-8.146 48.64 0 16.989 3.026 33.28 8.146 48.64l-.303.232h.303c20.247 60.51 76.8 105.426 143.36 105.426 34.443 0 63.534-9.31 86.341-24.67 27.23-18.152 45.382-45.148 51.433-77.032H261.12v-99.142h241.105c3.025 16.757 4.654 34.211 4.654 52.364 0 77.963-27.927 143.592-76.334 188.276-42.356 39.098-100.305 61.905-169.425 61.905-100.073 0-186.415-57.483-228.538-141.032v-.233z"/>
  </svg>

  <!-- Facebook -->
  <svg x="48" y="0" overflow="visible" width="24" height="24" viewBox="0 0 671 668" preserveAspectRatio="xMidYMid meet">
    <path d="M 668.333313 335 C 668.333313 150.904663 519.09668 1.666321 335 1.666321 C 150.904999 1.666321 1.666664 150.904663 1.666664 335 C 1.666664 501.376678 123.561996 639.276672 282.916656 664.283325 L 282.916656 431.353333 L 198.281342 431.353333 L 198.281342 335 L 282.916656 335 L 282.916656 261.562347 C 282.916656 178.020691 332.679993 131.874695 408.819977 131.874695 C 445.289978 131.874695 483.436646 138.38501 483.436646 138.38501 L 483.436646 220.416321 L 441.40332 220.416321 C 399.996643 220.416321 387.083344 246.110992 387.083344 272.473328 L 387.083344 335 L 479.529968 335 L 464.753357 431.353333 L 387.083344 431.353333 L 387.083344 664.283325 C 546.436646 639.276672 668.333313 501.376678 668.333313 335 Z"/>
  </svg>

  <!-- GitHub -->
  <svg x="72" y="0" overflow="visible" width="24" height="24" viewBox="0 0 512 499.368" preserveAspectRatio="xMidYMid meet">
    <path fill-rule="nonzero" d="M256.003 0C114.555 0 0 114.555 0 256.003c0 113.286 73.28 208.961 175.038 242.865 12.796 2.247 17.586-5.433 17.586-12.153 0-6.077-.309-26.225-.309-47.686-64.313 11.844-80.941-15.674-86.058-30.055-2.896-7.37-15.359-30.1-26.269-36.177-8.948-4.808-21.752-16.652-.31-16.961 20.168-.309 34.574 18.564 39.382 26.244 23.038 38.732 59.839 27.828 74.555 21.101 2.227-16.627 8.947-27.828 16.318-34.239-56.968-6.386-116.467-28.471-116.467-126.399 0-27.827 9.907-50.866 26.225-68.787-2.562-6.41-11.51-32.655 2.562-67.853 0 0 21.436-6.72 70.409 26.244 20.483-5.767 42.227-8.638 63.998-8.638 21.751 0 43.52 2.896 63.997 8.638 48.973-33.279 70.39-26.244 70.39-26.244 14.09 35.192 5.117 61.443 2.562 67.853 16.318 17.921 26.244 40.625 26.244 68.787 0 98.237-59.84 119.988-116.801 126.399 9.282 8.014 17.277 23.373 17.277 47.371 0 34.238-.309 61.751-.309 70.389 0 6.721 4.808 14.735 17.586 12.179C438.739 464.964 512 368.955 512 256.003 512 114.555 397.445 0 256.003 0z"/>
  </svg>
