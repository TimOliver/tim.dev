<svg xmlns="http://www.w3.org/2000/svg" width="48" height="24" viewBox="0 0 48 24" fill="none">
  <!--
    Like-button mask sprite (Tabler heart + heart-filled, side by side).
    Used as a CSS mask-image on Comentario's upvote button; the host element's
    background-color supplies the visible colour. Shapes are #fff so the mask
    works under both alpha- and luminance-masking. Swap states via mask-position:
      0%   -> outline heart (left cell)   = not liked
      100% -> filled heart  (right cell)  = you liked it
  -->
  <path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"
        fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path transform="translate(24 0)"
        d="M6.979 3.074a6 6 0 0 1 4.988 1.425l.037 .033l.034 -.03a6 6 0 0 1 4.733 -1.44l.246 .036a6 6 0 0 1 3.364 10.008l-.18 .185l-.048 .041l-7.45 7.379a1 1 0 0 1 -1.313 .082l-.094 -.082l-7.493 -7.422a6 6 0 0 1 3.176 -10.215z"
        fill="#fff" />
</svg>
